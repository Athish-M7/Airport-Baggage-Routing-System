server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:vaanam_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

vaanam:
  simulation:
    start-time: "2026-10-12T08:00:00"
    speed-multiplier: 1
    cutoff-lead-minutes: 45
